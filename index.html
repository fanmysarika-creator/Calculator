<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CALCULATOR</title>
<style>
  :root { --bg:#111; --panel:#1c1c1e; --key:#2c2c2e; --op:#ff9f0a; --fn:#48484a; --txt:#fff; --dim:#9a9a9f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt);
    font-family:-apple-system,Roboto,Arial,sans-serif; overflow:hidden; user-select:none; }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; padding:12px; }
  .screen.on { display:flex; }
  /* calculator */
  .top { display:flex; justify-content:space-between; align-items:center; padding:6px 4px; }
  .top b { letter-spacing:3px; color:var(--dim); font-size:14px; }
  .btn-s { background:none; border:1px solid #444; color:var(--dim); border-radius:16px; padding:7px 14px; font-size:14px; }
  .display { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-end; padding:8px 12px; overflow:hidden; }
  .expr { color:var(--dim); font-size:22px; min-height:28px; word-break:break-all; text-align:right; }
  .res { font-size:64px; font-weight:300; word-break:break-all; text-align:right; line-height:1.1; }
  .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding-bottom:10px; }
  .keys button { height:min(16vw,78px); border:0; border-radius:50%; font-size:28px; color:var(--txt); background:var(--key); }
  .keys button:active { filter:brightness(1.5); }
  .keys .fn { background:var(--fn); }
  .keys .op { background:var(--op); }
  .keys .zero { grid-column:span 2; border-radius:40px; text-align:left; padding-left:12%; }
  /* panels */
  h2 { margin:8px 4px 14px; font-weight:500; }
  .card { background:var(--panel); border-radius:14px; padding:14px; margin-bottom:12px; }
  .row { display:flex; align-items:center; justify-content:space-between; padding:14px 6px; border-bottom:1px solid #2a2a2c; }
  .row:last-child { border-bottom:0; }
  .row small { color:var(--dim); display:block; margin-top:3px; }
  input[type=password],input[type=text] { width:100%; background:#2c2c2e; border:1px solid #444; color:#fff;
    border-radius:10px; padding:13px; font-size:18px; margin:6px 0; user-select:text; }
  .btn { background:var(--op); color:#000; border:0; border-radius:10px; padding:13px 18px; font-size:16px; font-weight:600; }
  .btn.sec { background:#3a3a3c; color:#fff; }
  .btn.red { background:#5a2a2a; color:#fff; }
  .grow { flex:1; overflow-y:auto; }
  .msg { color:#ff6b6b; min-height:20px; font-size:14px; }
  .app { display:flex; align-items:center; justify-content:space-between; padding:12px 6px; border-bottom:1px solid #2a2a2c; }
  .app span { flex:1; font-size:17px; padding-right:8px; }
  .actions { display:flex; gap:8px; }
  .actions .btn { padding:9px 13px; font-size:14px; }
  .backbar { display:flex; gap:8px; margin-bottom:6px; }
  .note { color:var(--dim); font-size:13px; line-height:1.4; padding:4px; }
</style>
</head>
<body>

<!-- CALCULATOR -->
<div id="calc" class="screen on">
  <div class="top"><b>CALCULATOR</b><button class="btn-s" id="openSettings">Setting</button></div>
  <div class="display"><div class="expr" id="expr"></div><div class="res" id="res">0</div></div>
  <div class="keys" id="keys"></div>
</div>

<!-- SETTINGS -->
<div id="settings" class="screen">
  <div class="backbar"><button class="btn sec" data-go="calc">← Назад</button></div>
  <h2>Setting</h2>
  <div class="card">
    <div class="row" id="goHidden"><div>Скрытые приложения<small>нужен пароль</small></div><div>›</div></div>
    <div class="row"><div>Версия<small>CALCULATOR 1.0</small></div></div>
  </div>
</div>

<!-- PASSWORD -->
<div id="auth" class="screen">
  <div class="backbar"><button class="btn sec" data-go="settings">← Назад</button></div>
  <h2 id="authTitle">Введите пароль</h2>
  <div class="card">
    <input type="password" id="pw1" placeholder="Пароль (PIN или буквы)" autocomplete="off">
    <input type="password" id="pw2" placeholder="Повторите пароль" autocomplete="off" style="display:none">
    <div class="msg" id="authMsg"></div>
    <button class="btn" id="authOk" style="width:100%">OK</button>
  </div>
  <div class="note" id="authNote"></div>
</div>

<!-- HIDDEN APPS -->
<div id="hidden" class="screen">
  <div class="backbar">
    <button class="btn sec" data-go="calc">← Закрыть</button>
    <button class="btn" id="addApps">+ Добавить</button>
    <button class="btn sec" id="chgPw">Сменить пароль</button>
  </div>
  <h2>Скрытые приложения</h2>
  <div class="grow card" id="hList"></div>
  <div class="note">Приложения открываются отсюда. Чтобы убрать иконки с главного экрана, используйте настройки телефона (см. инструкцию).</div>
</div>

<!-- PICK APPS -->
<div id="pick" class="screen">
  <div class="backbar">
    <button class="btn sec" data-go="hidden">← Отмена</button>
    <button class="btn" id="pickSave">Сохранить</button>
  </div>
  <h2>Выберите приложения</h2>
  <input type="text" id="pickSearch" placeholder="Поиск">
  <div class="grow card" id="pList"></div>
</div>

<script>
(function(){
  /* ---------- helpers ---------- */
  var $ = function(id){ return document.getElementById(id); };
  function show(id){
    document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('on'); });
    $(id).classList.add('on');
  }
  document.querySelectorAll('[data-go]').forEach(function(b){
    b.onclick = function(){ show(b.getAttribute('data-go')); if(b.getAttribute('data-go')==='hidden') renderHidden(); };
  });
  function load(k, d){ try{ var v = localStorage.getItem(k); return v===null? d : JSON.parse(v); }catch(e){ return d; } }
  function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  async function hash(s){
    var salt = 'calc-v1:' + s;
    try{
      var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt));
      return Array.from(new Uint8Array(buf)).map(function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
    }catch(e){
      var h = 5381; for(var i=0;i<salt.length;i++){ h = ((h<<5)+h) ^ salt.charCodeAt(i); } return 'f' + (h>>>0).toString(16);
    }
  }

  /* ---------- native bridge ---------- */
  function Apps(){ return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Apps; }

  /* ---------- calculator ---------- */
  var expr = '';      // what the user typed (display form)
  var justEq = false;
  var layout = [
    ['C','fn'],['±','fn'],['%','fn'],['÷','op'],
    ['7'],['8'],['9'],['×','op'],
    ['4'],['5'],['6'],['−','op'],
    ['1'],['2'],['3'],['+','op'],
    ['0','zero'],['.'],['=','op']
  ];
  var keys = $('keys');
  layout.forEach(function(k){
    var b = document.createElement('button');
    b.textContent = k[0]; if(k[1]) b.className = k[1];
    b.onclick = function(){ press(k[0]); };
    keys.appendChild(b);
  });

  function fmt(n){
    if(!isFinite(n)) return 'Ошибка';
    var s = String(parseFloat(n.toPrecision(12)));
    return s;
  }

  // safe evaluator (shunting-yard)
  function evaluate(src){
    var s = src.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
    var tokens = [], i = 0, prev = null;
    while(i < s.length){
      var c = s[i];
      if(/[0-9.]/.test(c)){
        var j = i; while(j < s.length && /[0-9.]/.test(s[j])) j++;
        tokens.push(parseFloat(s.slice(i,j))); prev = 'n'; i = j; continue;
      }
      if(c === '-' && (prev === null || prev === 'o')){ // unary minus
        var j2 = i+1; while(j2 < s.length && /[0-9.]/.test(s[j2])) j2++;
        if(j2 > i+1){ tokens.push(-parseFloat(s.slice(i+1,j2))); prev='n'; i = j2; continue; }
        return NaN;
      }
      if('+-*/%'.indexOf(c) >= 0){
        if(c === '%'){ tokens.push('%'); prev = 'n'; i++; continue; }
        tokens.push(c); prev = 'o'; i++; continue;
      }
      return NaN;
    }
    // apply percent postfix
    var t2 = [];
    for(var k=0;k<tokens.length;k++){
      if(tokens[k] === '%'){ t2[t2.length-1] = t2[t2.length-1] / 100; } else t2.push(tokens[k]);
    }
    if(typeof t2[t2.length-1] === 'string') t2.pop();
    var prec = {'+':1,'-':1,'*':2,'/':2}, out = [], ops = [];
    t2.forEach(function(t){
      if(typeof t === 'number'){ out.push(t); }
      else{
        while(ops.length && prec[ops[ops.length-1]] >= prec[t]) out.push(ops.pop());
        ops.push(t);
      }
    });
    while(ops.length) out.push(ops.pop());
    var st = [];
    for(var q=0;q<out.length;q++){
      var x = out[q];
      if(typeof x === 'number') st.push(x);
      else{
        var b = st.pop(), a = st.pop();
        if(a === undefined || b === undefined) return NaN;
        st.push(x==='+'?a+b : x==='-'?a-b : x==='*'?a*b : a/b);
      }
    }
    return st.length === 1 ? st[0] : NaN;
  }

  function update(){
    $('expr').textContent = expr;
    var r = evaluate(expr);
    if(expr === '') $('res').textContent = '0';
    else if(!isNaN(r) || r === Infinity) $('res').textContent = fmt(r);
  }

  async function press(k){
    if(k === 'C'){ expr = ''; justEq = false; update(); return; }
    if(k === '='){
      // secret code: if the typed text is exactly the saved numeric password -> open vault
      var stored = load('pwHash', null);
      if(stored && /^[0-9]+$/.test(expr) && (await hash(expr)) === stored){
        expr = ''; update(); renderHidden(); show('hidden'); return;
      }
      var r = evaluate(expr);
      if(expr !== ''){ expr = isNaN(r) ? '' : fmt(r); if(isNaN(r)) $('res').textContent = 'Ошибка'; else $('res').textContent = expr; $('expr').textContent = ''; justEq = true; }
      return;
    }
    if(k === '±'){
      var m = expr.match(/(−?[0-9.]+)$/);
      if(m){
        var n = m[1];
        expr = expr.slice(0, expr.length - n.length) + (n[0] === '−' ? n.slice(1) : '−' + n);
        update();
      }
      return;
    }
    var isOp = '+−×÷'.indexOf(k) >= 0;
    if(justEq && !isOp && k !== '%'){ expr = ''; }
    justEq = false;
    if(isOp){
      if(expr === '' && k !== '−') return;
      if(/[+−×÷]$/.test(expr)) expr = expr.slice(0,-1);
    }
    if(k === '.'){
      var last = expr.split(/[+−×÷]/).pop();
      if(last.indexOf('.') >= 0) return;
      if(last === '') expr += '0';
    }
    expr += k;
    update();
  }

  /* ---------- settings / auth ---------- */
  var afterAuth = null;
  $('openSettings').onclick = function(){ show('settings'); };
  $('goHidden').onclick = function(){ openAuth(function(){ renderHidden(); show('hidden'); }); };

  function openAuth(next, forceNew){
    afterAuth = next;
    var has = !!load('pwHash', null) && !forceNew;
    $('pw1').value = ''; $('pw2').value = ''; $('authMsg').textContent = '';
    $('pw2').style.display = has ? 'none' : 'block';
    $('authTitle').textContent = has ? 'Введите пароль' : 'Создайте пароль';
    $('authNote').textContent = has ? '' :
      'Пароль может быть PIN-кодом или любыми буквами. Если пароль состоит только из цифр, его можно ввести на калькуляторе и нажать «=» — сразу откроются скрытые приложения. Если забудете пароль — удалите данные приложения в настройках телефона.';
    show('auth');
    $('authOk').dataset.mode = has ? 'check' : 'new';
  }

  $('authOk').onclick = async function(){
    var mode = this.dataset.mode, p = $('pw1').value;
    if(!p){ $('authMsg').textContent = 'Введите пароль'; return; }
    if(mode === 'check'){
      if((await hash(p)) === load('pwHash', null)){ var f = afterAuth; afterAuth = null; f && f(); }
      else { $('authMsg').textContent = 'Неверный пароль'; $('pw1').value = ''; }
    } else {
      if(p.length < 3){ $('authMsg').textContent = 'Минимум 3 символа'; return; }
      if(p !== $('pw2').value){ $('authMsg').textContent = 'Пароли не совпадают'; return; }
      save('pwHash', await hash(p));
      var f2 = afterAuth; afterAuth = null; f2 && f2();
    }
  };
  $('chgPw').onclick = function(){
    openAuth(function(){ renderHidden(); show('hidden'); }, true);
  };

  /* ---------- hidden apps list ---------- */
  function renderHidden(){
    var list = load('hiddenApps', []);
    var box = $('hList'); box.innerHTML = '';
    if(!list.length){
      box.innerHTML = '<div class="note">Пока пусто. Нажмите «+ Добавить» и выберите приложения.</div>';
      return;
    }
    list.forEach(function(a){
      var row = document.createElement('div'); row.className = 'app';
      var nm = document.createElement('span'); nm.textContent = a.name;
      var act = document.createElement('div'); act.className = 'actions';
      var o = document.createElement('button'); o.className = 'btn'; o.textContent = 'Открыть';
      o.onclick = function(){ var P = Apps(); if(P) P.launch({pkg:a.pkg}).catch(function(){ alert('Не удалось открыть'); }); };
      var d = document.createElement('button'); d.className = 'btn red'; d.textContent = '✕';
      d.onclick = function(){
        save('hiddenApps', load('hiddenApps', []).filter(function(x){ return x.pkg !== a.pkg; }));
        renderHidden();
      };
      act.appendChild(o); act.appendChild(d); row.appendChild(nm); row.appendChild(act); box.appendChild(row);
    });
  }

  /* ---------- pick apps ---------- */
  var installed = [], chosen = {};
  $('addApps').onclick = async function(){
    var P = Apps();
    if(!P){ alert('Список приложений доступен только в установленном APK'); return; }
    try{ var r = await P.list(); installed = r.apps.sort(function(a,b){ return a.name.localeCompare(b.name); }); }
    catch(e){ alert('Не удалось получить список'); return; }
    chosen = {};
    load('hiddenApps', []).forEach(function(a){ chosen[a.pkg] = true; });
    $('pickSearch').value = '';
    renderPick(''); show('pick');
  };
  $('pickSearch').oninput = function(){ renderPick(this.value); };
  function renderPick(q){
    q = q.toLowerCase();
    var box = $('pList'); box.innerHTML = '';
    installed.filter(function(a){ return a.name.toLowerCase().indexOf(q) >= 0; }).forEach(function(a){
      var row = document.createElement('label'); row.className = 'app';
      var nm = document.createElement('span'); nm.textContent = a.name;
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!chosen[a.pkg];
      cb.style.width = '22px'; cb.style.height = '22px';
      cb.onchange = function(){ if(cb.checked) chosen[a.pkg] = true; else delete chosen[a.pkg]; };
      row.appendChild(nm); row.appendChild(cb); box.appendChild(row);
    });
  }
  $('pickSave').onclick = function(){
    var out = installed.filter(function(a){ return chosen[a.pkg]; }).map(function(a){ return {name:a.name, pkg:a.pkg}; });
    save('hiddenApps', out);
    renderHidden(); show('hidden');
  };

  /* when the app goes to background, lock back to the calculator */
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ expr=''; update(); show('calc'); }
  });
  update();
})();
</script>
</body>
</html>
