name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          npm install
          mkdir -p www
          cp index.html www/index.html
          npx cap add android
          D=android/app/src/main/java/com/calculator/app
          mkdir -p $D
          cp AppsPlugin.java MainActivity.java $D/
          sed -i 's|<application|<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/><application|' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
